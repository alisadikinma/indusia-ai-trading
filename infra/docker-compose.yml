services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ai-trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # TimescaleDB tuning hint — auto-tunes based on container memory
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      # 127.0.0.1 bind only — never expose Postgres publicly.
      # Production VPS reaches via Tailscale; dev box reaches via localhost.
      # Host port is configurable to dodge Windows Hyper-V reserved-port ranges.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    shm_size: 256mb

volumes:
  postgres_data:
    name: ai-trading-postgres-data

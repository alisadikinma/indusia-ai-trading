[project]
name = "indusia-ai-trading"
version = "0.0.1"
description = "INDUSIA AI Trading — multi-bot autonomous trading platform (crypto + Polymarket) with LLM oversight brain. Built by PT INDUSIA Kecerdasan Digital."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Ali Sadikin", email = "ali.sadikincom85@gmail.com" }]

dependencies = [
    # Phase 2 — data ingestion runtime deps. These are needed by the
    # `infra/data_loader/*` modules and their tests.
    "httpx[http2]>=0.27",
    "polars>=1.0",
    "websockets>=13",
    "psycopg[binary]>=3.2",
    # Phase J of multi-bot restructure plan — token counting for the
    # compiled-references budget gate (infra/scripts/compile_refs.py).
    "tiktoken>=0.7",
    # Phase 2 polymarket on-chain ingestion via Envio HyperSync — streams
    # Polymarket OrderFilled events from Polygon at multi-thousand-events/sec
    # (infra/data_loader/polymarket_envio.py). Requires ENVIO_API_TOKEN env
    # (https://envio.dev/app/api-tokens, free tier, registration required
    # since 2025-11-03). Optional at install time — loader fails loud per
    # Iron Law 3 if env var absent.
    "hypersync",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "pulse-bridge/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: integration tests requiring live services (Postgres, Telegram)",
    "slow: tests that take more than 5 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["freqtrade-fork", "dashboard-ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # let formatter handle line length

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["freqtrade-fork/", "dashboard-ui/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["freqtrade.*", "ccxt.*"]
ignore_missing_imports = true

[project]
name = "pulse-bridge"
version = "0.0.1"
description = "AI Trading 24/7 — FastAPI shim: Claude↔Freqtrade bridge + dashboard read-only API"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.29",
    "python-jose[cryptography]>=3.3",
    "websockets>=13",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse_bridge*"]
exclude = ["tests*"]

name: CI

# Quality gate. Runs on every push + PR to main. NO deploy effects —
# tests + lint + typecheck only. Deploy runs in parallel from deploy.yml
# (jobhunter pattern — both fire on push, neither blocks the other).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests + migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trading
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://trader:trader@127.0.0.1:5432/trading
      PGPASSWORD: trader

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e pulse-bridge

      - name: Apply init.sql + migrations
        run: |
          psql -h 127.0.0.1 -U trader -d trading -v ON_ERROR_STOP=1 \
              -f infra/postgres/init.sql
          for m in infra/migrations/0*.sql; do
            echo "::group::$m"
            psql -h 127.0.0.1 -U trader -d trading -v ON_ERROR_STOP=1 -f "$m"
            echo "::endgroup::"
          done

      - name: Pytest
        run: python -m pytest tests/ pulse-bridge/tests/ -v --tb=short

  frontend:
    name: Frontend typecheck + lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
